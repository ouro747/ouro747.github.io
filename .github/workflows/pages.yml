name: Deploy Global Pharma to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialize official source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .bootstrap/global-pharma-official.tar.gz ]; then
            tar -xzf .bootstrap/global-pharma-official.tar.gz -C .
            rm -rf .bootstrap
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: materialize official Global Pharma source"
              git push
            fi
          fi

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check data.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
