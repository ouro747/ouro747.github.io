name: Deploy Global Pharma to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check supabase.js
          node --check payment-adapter.js
          node --check landing-pages.js

      - name: Validate static frontend
        shell: bash
        run: |
          set -euo pipefail

          if grep -Fq '\\n' index.html || grep -Fq '\\n' 404.html; then
            echo "Literal \\n sequence found in HTML."
            exit 1
          fi

          refs=$(grep -Eho '/assets/[A-Za-z0-9._/-]+' app.js styles.css | sort -u || true)
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            file=".${ref}"
            if [ ! -f "$file" ]; then
              echo "Missing referenced asset: $ref"
              exit 1
            fi
          done <<< "$refs"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
